spring:
  application:
    name: hansen-village-application

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hansen-village}
    username: ${SPRING_DATASOURCE_USERNAME:myUser}
    password: ${SPRING_DATASOURCE_PASSWORD:myPass}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:looneyhardy@gmail.com}
    password: ${MAIL_PASSWORD:ijmkjkfkdwgwolqy}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    default-schema: public

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

store:
  jwt:
    secret: ${STORE_JWT_SECRET:hansen-village-academy-hebron-jwt-secret-key-min-32-characters-long}
    expiration-ms: ${STORE_JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${STORE_JWT_REFRESH_EXPIRATION_MS:2592000000}

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.liquibase: INFO