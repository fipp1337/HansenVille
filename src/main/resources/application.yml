spring:
  application:
    name: hansen-village-application
  datasource:
    url: jdbc:postgresql://localhost:5432/hansen-village
    username: myUser
    password: myPass
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    default-schema: public

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

store:
  jwt:
    secret: "hansen-village-academy-hebron-jwt-secret-key-min-32-characters-long"
    expiration-ms: 86400000
    refresh-expiration-ms: 2592000000

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.liquibase: INFO