spring:
  application:
    name: hansen-village-application
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    default-schema: public

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

store:
  jwt:
    secret: "hansen-village-academy-teaching-jwt-secret-key-min-32-characters-long"
    expiration-ms: 86400000
    refresh-expiration-ms: 2592000000

server:
  port: 8080

logging:
  level:
    org.testcontainers: DEBUG
    com.github.dockerjava: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.liquibase: INFO